ready_refinement_requirements:
  - Ready task has a current detailed spec_path
  - Ready task has explicit exclusive_resources metadata, even when the value is []
  - every human/product/domain/architecture/security gate required for execution is empty or satisfied
  - infrastructure verification required/conditional never grants real-AWS execution
  - no task requires AWS account, IAM/OIDC, Budget/credit, cloud authorization, or real-cloud preview/staging under ADR-012


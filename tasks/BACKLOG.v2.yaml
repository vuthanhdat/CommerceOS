lifecycle_semantics:
  Backlog: canonical task exists but is not claimed by a Builder
  Active: a Ready task is currently claimed/executing
  Completed: accepted result is present on authoritative main and the canonical completion record exists
  Blocked: execution stopped on an explicit unresolved gate; blockers do not count as Completed
  dependency_unlock: only Completed dependencies or declared completed_roots satisfy a dependency

dispatch_policy:
  dependency_satisfied: dependency is in completed_roots or canonical task lifecycle_state is Completed
  dispatchable: maturity Ready + lifecycle_state Backlog + dependencies/gates satisfied + no exclusive-resource conflict
  max_writable_builders: 2
  merge_lane_concurrency: 1
  numeric_order_is_not_readiness: true
  cloud_requires_explicit_gate: true
  outline_or_refined_is_never_dispatchable: true

integration_policy:
  builder_claim_does_not_complete_task: true
  local_agent_success_does_not_complete_task: true
  required_verification_must_pass: true
  independent_review_required_for_builder_changes: true
  integration_uses_latest_main: true
  merge_lane_is_serial: true
  force_push_main: false
  completed_only_after_verified_result_on_main: true


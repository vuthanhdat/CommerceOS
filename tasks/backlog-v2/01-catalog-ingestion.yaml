  - [TASK-0113, Outline, "reliability", "ProductDataIngestion", "Make ingestion observable, recoverable, and redrive-safe", "Add parser/crawl operational visibility, DLQ/redrive, poison handling, and reconciliation without changing business facts.", [TASK-0111], [], "Builder", "default", "conditional", ""]

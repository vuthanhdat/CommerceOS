  - [TASK-0106, Outline, "feature", "Catalog", "Deliver tenant-scoped Catalog management", "Implement Product details, SKU, Category, Brand, specifications, advisory cost, and concurrency-safe edits.", [TASK-0105], [], "Builder", "default", "conditional", ""]
